<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>圖卡示意</title>
<style>
  body { margin: 0; background: #111; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; color: #fff; display: flex; gap: 28px; padding: 24px; }
  .phone { width: 380px; background: #1c1c1e; border-radius: 22px; overflow: hidden; }
  .bar { background: #2c2c2e; padding: 14px 16px; font-weight: 700; font-size: 17px; }
  .chat { padding: 16px 12px 22px; }
  .row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 14px; }
  .ava { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex: none; }
  .name { font-size: 12px; color: #9a9aa0; margin-bottom: 4px; }
  .text { background: #3a3a3c; padding: 9px 12px; border-radius: 16px; font-size: 15px; display: inline-block; }
  .card { width: 262px; background: #fff; color: #111; border-radius: 16px; overflow: hidden; }
  .card img { width: 100%; display: block; }
  .card .body { padding: 14px 16px 6px; }
  .card .t { font-size: 20px; font-weight: 900; }
  .card .s { font-size: 13px; color: #777; margin-top: 4px; }
  .card .btn { margin: 10px 14px 14px; background: #e23a3a; color: #fff; text-align: center; font-weight: 900; font-size: 17px; padding: 11px 0; border-radius: 10px; letter-spacing: 0.15em; }
  .time { font-size: 11px; color: #777; align-self: flex-end; }
  .cap { font-size: 13px; color: #9a9aa0; padding: 0 14px 16px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="bar">好利來</div>
    <div class="chat">
      <div class="row"><img class="ava" src="../assets/og_haolilai.jpg" alt="">
        <div><div class="name">好利來</div><div class="text">感謝支持,送你抽獎機會!</div></div></div>
      <div class="row"><img class="ava" src="../assets/og_haolilai.jpg" alt="">
        <div class="card">
          <img src="../assets/card_haolilai.jpg" alt="">
          <div class="body"><div class="t">好利連連來</div><div class="s">拉一把,試試手氣。三個連線中大獎</div></div>
          <div class="btn">立即抽獎</div>
        </div><div class="time">16:10</div></div>
    </div>
    <div class="cap">整張圖卡點哪裡都會開遊戲</div>
  </div>
</body>
</html>
